<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#33262b"/>
      <stop offset="100%" stop-color="#24191d"/>
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff9f3"/>
      <stop offset="45%" stop-color="#f4d9de"/>
      <stop offset="100%" stop-color="#d98f9f"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="glow"/>
      <feComposite in="SourceGraphic" in2="glow" operator="over"/>
    </filter>
  </defs>
  <!-- Rounded squircle matching Quiz Arena .brand-mark -->
  <rect width="64" height="64" rx="18" fill="url(#bgGrad)"/>
  <!-- Subtle inner border line using palette line/rose -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="16.5" fill="none" stroke="#d98f9f" stroke-opacity="0.35" stroke-width="1.5"/>
  <!-- Signature 4-pointed sparkle star ✦ -->
  <path d="M 32 10 C 32 21.5 21.5 32 10 32 C 21.5 32 32 42.5 32 54 C 32 42.5 42.5 32 54 32 C 42.5 32 32 21.5 32 10 Z" fill="url(#starGrad)" filter="url(#softGlow)"/>
  <!-- Center radiant sparkle dot -->
  <circle cx="32" cy="32" r="2.5" fill="#fff9f3"/>
</svg>
